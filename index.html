<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <body>
        <header>
            <div id="logo">
                <img src="img/logo.png" alt="">
            </div>
            <div id="PLEN">
                <p id="PL">PL</p>
                <p>|</p>
                <p id="EN">EN</p>
            </div>    
            <div id="menu-icon">
                <img src="img/menu-icon.svg" alt="">
            </div>
        </header>
        
        <div id="main">
            <div id="main-photo">
                <img src="img/lukalaker.png" alt="">
            </div>

            <div id="main-header">
                <h2>Zmieniamy <br> świat na lepszy.</h2>
            </div>

            <div id="main-text">
                <h1> Specjalizujemy się w skupie i ekologicznym 
                    przetwarzaniu transformatorów. 
                    Zapewniamy atrakcyjne warunki sprzedaży.</h1>
            </div>

            <button id="main-button" type="button">
                Więcej...
            </button>
        </div>

        <div id="offer">
            <div id="windows">
                <div class="window"><img src="img/contract.png"></div>
                <div class="window"><img src="img/transformator.png"></div>
                <div class="window"><img src="img/deal.png"></div>
                <div class="window"><p>Opinie</p></div>
            </div>
        </div>

        

        
        <script src="script.js" async defer></script>
